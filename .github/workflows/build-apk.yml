name: Build WhatsApp Exporter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:

      # =====================================================
      # 1. CHECKOUT SOURCE CODE
      # =====================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # =====================================================
      # 2. SETUP PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # 3. SETUP JAVA 17
      # =====================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # 4. INSTALL LINUX DEPENDENCIES
      # =====================================================

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext


      # =====================================================
      # 5. INSTALL BUILD TOOLS
      # =====================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install "cython==0.29.34"


      # =====================================================
      # 6. CHECK PYTHON / JAVA / BUILDOZER
      # =====================================================

      - name: Check build environment
        run: |
          python --version
          java -version
          buildozer --version


      # =====================================================
      # 7. ACCEPT ANDROID LICENSE
      # =====================================================

      - name: Configure Android license
        run: |
          if grep -q "android.accept_sdk_license" buildozer.spec; then
            sed -i \
              's/^#\?[[:space:]]*android.accept_sdk_license[[:space:]]*=.*/android.accept_sdk_license = True/' \
              buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi


      # =====================================================
      # 8. BUILD APK
      # =====================================================

      - name: Build APK
        run: |
          buildozer android debug


      # =====================================================
      # 9. SHOW GENERATED FILES
      # =====================================================

      - name: Show APK files
        run: |
          echo "Generated APK files:"
          find bin -type f -name "*.apk" -print


      # =====================================================
      # 10. UPLOAD APK
      # =====================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Chat-Exporter-APK
          path: bin/*.apk
          if-no-files-found: error